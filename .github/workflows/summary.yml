name: summary

# Weekly narrative summary of the last 7 days, written to public.weekly_summary
# and read by the dashboard.
#
# Scheduled after Sunday's full re-sweep rather than run inside the sync job:
# a summarisation failure -- a rate limit, a refusal, a bad gateway -- must not
# mark the data sync as failed, and re-running one must not re-crawl.
on:
  schedule:
    - cron: '45 5 * * 0'     # Sunday 05:45 UTC, ~90 min after the full sync
  workflow_dispatch:
    inputs:
      days:
        description: 'Window in days'
        type: string
        default: '7'

concurrency:
  group: summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Summarise
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          node --no-warnings=ExperimentalWarning src/summarize.ts \
            --days "${{ inputs.days || '7' }}"

      - name: Summary
        if: always()
        run: echo "### Weekly summary job finished" >> "$GITHUB_STEP_SUMMARY"
