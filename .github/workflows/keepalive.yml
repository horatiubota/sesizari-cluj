name: keepalive

# GitHub disables scheduled workflows in public repositories after 60 days with
# "no repository activity", and does not document what counts as activity. The
# sync workflow never commits anything, so without this the whole schedule --
# including sync itself -- would silently stop after two idle months.
#
# Runs monthly rather than at the 60-day boundary: scheduled runs are best-effort
# and can be skipped under load, so firing at the limit would mean one missed run
# loses the window. Monthly gives 2x margin.
#
# Commits a real content change rather than an empty commit, since an empty
# commit relies on an undocumented rule counting it.
on:
  schedule:
    - cron: '0 5 1 * *'   # 1st of each month, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Allowed to fail: a paused or unreachable database must not defeat the
      # keepalive, which is the one job that has to succeed.
      - name: Refresh stats snapshot
        id: snap
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node --no-warnings=ExperimentalWarning scripts/snapshot.ts

      - name: Heartbeat
        run: |
          mkdir -p snapshot
          {
            date -u +"last keepalive: %Y-%m-%dT%H:%M:%SZ"
            echo "snapshot refresh: ${{ steps.snap.outcome }}"
          } > snapshot/heartbeat.txt

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot/
          if git diff --staged --quiet; then
            echo "no change to commit — this should not happen, heartbeat always moves"
            exit 1
          fi
          git commit -m "Refresh stats snapshot

          Automated. Keeps the repository active so GitHub does not disable the
          scheduled sync workflow after 60 days of inactivity."
          git push

      - name: Summary
        run: |
          {
            echo "### Keepalive"
            echo "- snapshot refresh: \`${{ steps.snap.outcome }}\`"
            echo "- next scheduled run: 1st of next month, 05:00 UTC"
          } >> "$GITHUB_STEP_SUMMARY"
