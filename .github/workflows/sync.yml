name: sync

# Daily pass catches new tickets cheaply (~5 requests).
# Weekly pass re-reads all history, which is the only way to notice that an old
# ticket changed status: the upstream API has no "modified since" filter.
on:
  schedule:
    - cron: '17 4 * * 1-6'   # Mon-Sat 04:17 UTC — recent only
    - cron: '17 4 * * 0'     # Sunday  04:17 UTC — full re-sweep
  workflow_dispatch:
    inputs:
      mode:
        description: 'recent (last 30 days) or full (entire history)'
        type: choice
        options: [recent, full]
        default: recent

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with: { version: 10 }

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Decide mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "full=${{ inputs.mode == 'full' }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "17 4 * * 0" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
          fi

      # The runner's SQLite is ephemeral and only stages this run's fetch.
      # Change detection lives in Postgres: the upsert compares against stored
      # state and the trigger appends history, so a fresh staging file is fine.
      - name: Crawl
        env:
          MYCLUJ_DELAY_MS: '500'   # gentler than local default
        run: |
          if [ "${{ steps.mode.outputs.full }}" = "true" ]; then
            node --no-warnings=ExperimentalWarning src/sync.ts --full
          else
            node --no-warnings=ExperimentalWarning src/sync.ts --days 30
          fi

      - name: Load into Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node --no-warnings=ExperimentalWarning src/load.ts

      # load.ts deliberately never writes neighborhood or is_default_pin -- both
      # are derived from lat/lon rather than carried by the upstream API, so they
      # are computed here instead. This ran only as a one-off during the initial
      # backfill, which left every ticket ingested afterwards showing as
      # "(nelocalizat)" on the dashboard. Idempotent and whole-corpus: the full
      # Sunday sweep can move an old ticket's coordinates, and the update writes
      # only rows whose value actually changed.
      - name: Locate (default pins, then neighbourhoods)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node --no-warnings=ExperimentalWarning scripts/neighborhoods.ts

      # Both dashboard pages are statically rendered with a time-based
      # `revalidate`, which Next only honours on request: on a low-traffic site
      # the first visitor after the window expires is served the stale copy and
      # merely triggers the rebuild for whoever comes next. That is how the
      # dashboard came to advertise a three-day-old date range while the database
      # was current. Ping the site so the pages are correct as soon as the data is.
      #
      # Allowed to fail: everything is already durably loaded by this point, and
      # the pages still self-heal on their own timer. Reporting a successful
      # ingest as a failed sync would be the worse error.
      - name: Revalidate the dashboard
        id: revalidate
        continue-on-error: true
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://sesizari-cluj.vercel.app' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          if [ -z "$REVALIDATE_SECRET" ]; then
            echo "REVALIDATE_SECRET is not set for this repository; skipping." >&2
            exit 1
          fi
          code=$(curl -sS --max-time 60 -o /tmp/revalidate.json -w '%{http_code}' \
            -X POST "$SITE_URL/api/revalidate" \
            -H "x-revalidate-secret: $REVALIDATE_SECRET")
          echo "HTTP $code"
          cat /tmp/revalidate.json && echo
          [ "$code" = "200" ]

      - name: Summary
        if: always()
        run: |
          {
            echo "### Sync complete"
            echo "- mode: \`${{ steps.mode.outputs.full == 'true' && 'full' || 'recent' }}\`"
            echo "- staged db: \`$(du -h data/mycluj.db 2>/dev/null | cut -f1)\`"
            echo "- dashboard revalidation: \`${{ steps.revalidate.outcome }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
